<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Column Options Explorer - CanBEM-AI</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .search-box {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }
        
        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .column-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .column-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }
        
        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .column-name {
            font-size: 18px;
            font-weight: 600;
            color: #2d3748;
            flex: 1;
        }
        
        .column-count {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        
        .options-container {
            max-height: 200px;
            overflow-y: auto;
            background: #f7fafc;
            border-radius: 8px;
            padding: 15px;
        }
        
        .option-item {
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border-radius: 6px;
            border-left: 3px solid #667eea;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            color: white;
        }
        
        .stat-item {
            flex: 1;
            text-align: center;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .filter-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .filter-btn:hover {
            border-color: #667eea;
            background: #f7fafc;
        }
        
        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }
        
        .expand-btn {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-size: 14px;
            padding: 5px 10px;
            margin-top: 10px;
            text-decoration: underline;
        }
        
        .expand-btn:hover {
            color: #764ba2;
        }
        
        .no-results {
            text-align: center;
            padding: 40px;
            color: #718096;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <img src="Logo_New.png" alt="CanBEM-AI Logo" class="company-logo" onerror="this.style.display='none'">
            <div class="header-content">
                <h1>🔍 Column Options Explorer</h1>
                <p class="tagline">Browse Available Options for ComStock Input Columns</p>
            </div>
            <div style="position: absolute; top: 20px; right: 20px;">
                <button onclick="window.location.href='retrofit-planner.html'" class="btn btn-secondary" style="padding: 8px 16px; font-size: 14px;">
                    ⬅️ Back to Retrofit Planner
                </button>
            </div>
        </header>

        <div class="content">
            <div class="stats-bar" id="statsBar">
                <div class="stat-item">
                    <div class="stat-value" id="totalColumns">-</div>
                    <div class="stat-label">Total Columns</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalOptions">-</div>
                    <div class="stat-label">Total Unique Options</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="avgOptions">-</div>
                    <div class="stat-label">Avg Options per Column</div>
                </div>
            </div>

            <div class="form-section">
                <input type="text" 
                       class="search-box" 
                       id="searchBox" 
                       placeholder="🔍 Search columns by name... (e.g., sqft, climate, building)"
                       onkeyup="filterColumns()">
                
                <div class="filter-section">
                    <button class="filter-btn active" onclick="filterByCount('all')">All Columns</button>
                    <button class="filter-btn" onclick="filterByCount('small')">≤10 Options</button>
                    <button class="filter-btn" onclick="filterByCount('medium')">11-50 Options</button>
                    <button class="filter-btn" onclick="filterByCount('large')">50+ Options</button>
                </div>
            </div>

            <div id="columnsContainer">
                <div class="no-results">Loading column options...</div>
            </div>
        </div>

        <footer style="text-align: center; padding: 30px; color: #718096; margin-top: 50px; border-top: 1px solid #e2e8f0;">
            <p>© 2026 CanBEM-AI - Column Options Explorer</p>
        </footer>
    </div>

    <script>
        let columnOptions = {};
        let currentFilter = 'all';

        async function loadColumnOptions() {
            try {
                const response = await fetch('column_options.json');
                columnOptions = await response.json();
                
                // Calculate statistics
                const totalColumns = Object.keys(columnOptions).length;
                const totalOptions = Object.values(columnOptions).reduce((sum, opts) => sum + opts.length, 0);
                const avgOptions = Math.round(totalOptions / totalColumns);
                
                document.getElementById('totalColumns').textContent = totalColumns;
                document.getElementById('totalOptions').textContent = totalOptions.toLocaleString();
                document.getElementById('avgOptions').textContent = avgOptions;
                
                displayColumns();
                
            } catch (error) {
                console.error('Error loading column options:', error);
                document.getElementById('columnsContainer').innerHTML = 
                    '<div class="no-results">❌ Error loading column options. Please make sure column_options.json is present.</div>';
            }
        }

        function displayColumns(searchTerm = '') {
            const container = document.getElementById('columnsContainer');
            const columns = Object.keys(columnOptions).sort();
            
            let filteredColumns = columns.filter(col => {
                // Search filter
                if (searchTerm && !col.toLowerCase().includes(searchTerm.toLowerCase())) {
                    return false;
                }
                
                // Count filter
                const optCount = columnOptions[col].length;
                if (currentFilter === 'small' && optCount > 10) return false;
                if (currentFilter === 'medium' && (optCount <= 10 || optCount > 50)) return false;
                if (currentFilter === 'large' && optCount <= 50) return false;
                
                return true;
            });
            
            if (filteredColumns.length === 0) {
                container.innerHTML = '<div class="no-results">No columns found matching your criteria.</div>';
                return;
            }
            
            container.innerHTML = '';
            
            filteredColumns.forEach(col => {
                const options = columnOptions[col];
                const card = document.createElement('div');
                card.className = 'column-card';
                
                const displayOptions = options.slice(0, 20);
                const hasMore = options.length > 20;
                
                card.innerHTML = `
                    <div class="column-header">
                        <div class="column-name">${col}</div>
                        <div class="column-count">${options.length} option${options.length !== 1 ? 's' : ''}</div>
                    </div>
                    <div class="options-container" id="options-${col.replace(/\./g, '-')}">
                        ${displayOptions.map(opt => `<div class="option-item">${opt}</div>`).join('')}
                        ${hasMore ? `
                            <button class="expand-btn" onclick="expandOptions('${col.replace(/\./g, '-')}', '${col}')">
                                Show all ${options.length} options ▼
                            </button>
                        ` : ''}
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        function expandOptions(cleanId, originalCol) {
            const options = columnOptions[originalCol];
            const container = document.getElementById(`options-${cleanId}`);
            
            container.innerHTML = options.map(opt => `<div class="option-item">${opt}</div>`).join('') + `
                <button class="expand-btn" onclick="collapseOptions('${cleanId}', '${originalCol}')">
                    Show less ▲
                </button>
            `;
        }

        function collapseOptions(cleanId, originalCol) {
            const options = columnOptions[originalCol];
            const displayOptions = options.slice(0, 20);
            const container = document.getElementById(`options-${cleanId}`);
            
            container.innerHTML = displayOptions.map(opt => `<div class="option-item">${opt}</div>`).join('') + `
                <button class="expand-btn" onclick="expandOptions('${cleanId}', '${originalCol}')">
                    Show all ${options.length} options ▼
                </button>
            `;
        }

        function filterColumns() {
            const searchTerm = document.getElementById('searchBox').value;
            displayColumns(searchTerm);
        }

        function filterByCount(type) {
            currentFilter = type;
            
            // Update button states
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            filterColumns();
        }

        // Load options on page load
        window.onload = loadColumnOptions;
    </script>
</body>
</html>
